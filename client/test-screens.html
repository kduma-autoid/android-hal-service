<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screens &amp; NFC Control</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { margin: 0; padding: 20px; background: #1a1a2e; color: #eee; min-height: 100vh; }
        h1 { margin: 0 0 20px; font-size: 22px; color: #fff; }
        .card { background: #16213e; padding: 16px; margin-bottom: 16px; border-radius: 10px; }
        .card h2 { margin: 0 0 12px; font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        input { padding: 8px 12px; border: 1px solid #333; border-radius: 6px; font-size: 14px; background: #0f3460; color: #eee; width: 260px; }
        input::placeholder { color: #555; }
        input[type="range"] { width: auto; flex: 1; accent-color: #fdd835; }
        select { padding: 8px 12px; border: 1px solid #333; border-radius: 6px; font-size: 14px; background: #0f3460; color: #eee; }
        button { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; transition: opacity 0.15s, transform 0.1s; }
        button:hover { opacity: 0.85; }
        button:active { transform: scale(0.97); }
        .row { margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
        .row label { width: 80px; font-size: 13px; color: #888; flex-shrink: 0; }
        .btn-connect { background: #34a853; color: #fff; }
        .btn-on { background: #34a853; color: #fff; flex: 1; }
        .btn-off { background: #ea4335; color: #fff; flex: 1; }
        .btn-set { background: #1e88e5; color: #fff; }
        .status { font-size: 12px; color: #888; margin-left: 8px; }
        .status.ok { color: #34a853; }
        .status.err { color: #ea4335; }

        .screen-card { background: #0f3460; border: 1px solid #1a4a8a; border-radius: 8px; padding: 14px; margin-bottom: 10px; }
        .screen-card h3 { margin: 0 0 4px; font-size: 16px; color: #fff; }
        .screen-card .sn { font-size: 11px; color: #666; font-family: monospace; margin-bottom: 10px; }
        .screen-card .control-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .screen-card .control-row:last-child { margin-bottom: 0; }
        .screen-card .control-label { width: 80px; font-size: 12px; color: #888; flex-shrink: 0; }
        .screen-card .toggle-row { display: flex; gap: 6px; flex: 1; }
        .screen-card .toggle-row button { flex: 1; padding: 6px 10px; font-size: 12px; }
        .screen-card .slider-row { display: flex; align-items: center; gap: 8px; flex: 1; }
        .screen-card .slider-val { font-family: monospace; font-size: 14px; width: 32px; text-align: right; }
        .screen-card .slider-row button { padding: 6px 12px; font-size: 12px; }
        .empty-msg { color: #555; font-style: italic; }

        .nfc-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .nfc-row label { width: 80px; font-size: 12px; color: #888; flex-shrink: 0; }
        .nfc-row select { flex: 1; }
        .nfc-row .slider-row { display: flex; align-items: center; gap: 8px; flex: 1; }
        .nfc-row .slider-val { font-family: monospace; font-size: 14px; width: 32px; text-align: right; }

        #response { font-family: monospace; font-size: 12px; padding: 10px; background: #0a0a1a; border-radius: 6px; min-height: 32px; color: #7f7; white-space: pre-wrap; word-break: break-all; }
        #response.err { color: #f77; }
        #events { font-family: monospace; font-size: 12px; padding: 10px; background: #0a0a1a; border-radius: 6px; min-height: 60px; max-height: 200px; overflow: auto; color: #fc6; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>
    <h1>Screens &amp; NFC Control</h1>

    <div class="card">
        <h2>Connection</h2>
        <div class="row">
            <label>URL</label>
            <input id="baseUrl" value="http://localhost:8400" />
        </div>
        <div class="row">
            <label>Client ID</label>
            <input id="clientId" value="screens-client" />
        </div>
        <div class="row">
            <label>Token</label>
            <input id="token" placeholder="Auto-filled" />
        </div>
        <div class="row" style="margin-top:4px">
            <button class="btn-connect" onclick="doConnect()">Connect</button>
            <span id="connStatus" class="status"></span>
        </div>
    </div>

    <div class="card">
        <h2>Screens</h2>
        <div id="screens"><span class="empty-msg">Connect to load screens...</span></div>
    </div>

    <div class="card">
        <h2>NFC</h2>
        <div class="nfc-row">
            <label>NFC Screen</label>
            <select id="nfcSelect"><option value="">Main screen</option></select>
            <button class="btn-set" onclick="setNfcModule()">Set</button>
        </div>
        <div class="nfc-row">
            <label>Watermark</label>
            <div class="slider-row">
                <input type="range" id="nfcAlpha" min="0" max="100" value="100" oninput="document.getElementById('nfcAlphaVal').textContent=this.value" />
                <span class="slider-val" id="nfcAlphaVal">100</span>
                <button class="btn-set" onclick="setNfcWatermark()">Set</button>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>Events</h2>
        <div id="events">Waiting for connection...</div>
    </div>

    <div class="card">
        <h2>Response</h2>
        <div id="response">-</div>
    </div>

    <script src="hal-client.js"></script>
    <script>
        let client = null;
        let screenData = {}; // { sn: model }

        function getClient() {
            const url = document.getElementById('baseUrl').value;
            if (!client || client.baseUrl !== url) client = new HalClient(url);
            const t = document.getElementById('token').value;
            if (t) client.token = t;
            return client;
        }

        function showResponse(data, isError) {
            const el = document.getElementById('response');
            el.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
            el.className = isError ? 'err' : '';
        }

        function logEvent(event, data) {
            const el = document.getElementById('events');
            const ts = new Date().toLocaleTimeString();
            el.textContent += `\n[${ts}] ${event}: ${JSON.stringify(data)}`;
            el.scrollTop = el.scrollHeight;
        }

        async function doConnect() {
            const status = document.getElementById('connStatus');
            try {
                status.textContent = 'Connecting...';
                status.className = 'status';
                const c = getClient();
                const res = await c.requestToken(document.getElementById('clientId').value, null, ['sunmi.screen', 'sunmi.nfc']);
                if (!res.token) {
                    status.textContent = 'Token error';
                    status.className = 'status err';
                    showResponse(res, true);
                    return;
                }
                document.getElementById('token').value = res.token;
                await c.connectWs();
                await c.wsAuthenticate();
                await c.wsSubscribe(['sunmi.screen.*', 'sunmi.nfc.*']);
                c.on('sunmi.screen.*', onEvent);
                c.on('sunmi.nfc.*', onEvent);
                status.textContent = 'Connected (WS)';
                status.className = 'status ok';
                document.getElementById('events').textContent = 'Listening for events...';
                showResponse(res);
                await refreshScreens();
            } catch (e) {
                status.textContent = 'Error';
                status.className = 'status err';
                showResponse(e.message, true);
            }
        }

        async function onEvent(event, data) {
            logEvent(event, data);
            if (event.includes('Changed')) {
                await refreshScreens();
            }
        }

        async function exec(method, params) {
            try {
                const res = await getClient().execute(method, params);
                showResponse(res, !!res.error);
                return res;
            } catch (e) {
                showResponse(e.message, true);
                return null;
            }
        }

        async function refreshScreens() {
            const res = await exec('sunmi.screen.getDeviceInfo', {});
            if (!res || !res.info) return;
            screenData = res.info;
            renderScreens();
            renderNfcSelect();
        }

        function renderScreens() {
            const container = document.getElementById('screens');
            const entries = Object.entries(screenData);
            if (!entries.length) {
                container.innerHTML = '<span class="empty-msg">No screens detected.</span>';
                return;
            }
            container.innerHTML = entries.map(([sn, model]) => `
                <div class="screen-card">
                    <h3>${esc(model)}</h3>
                    <div class="sn">${esc(sn)}</div>
                    <div class="control-row">
                        <span class="control-label">Screen</span>
                        <div class="toggle-row">
                            <button class="btn-on" onclick="setScreen('${esc(sn)}',true)">Enable</button>
                            <button class="btn-off" onclick="setScreen('${esc(sn)}',false)">Disable</button>
                        </div>
                    </div>
                    <div class="control-row">
                        <span class="control-label">Touch</span>
                        <div class="toggle-row">
                            <button class="btn-on" onclick="setTouch('${esc(sn)}',true)">Enable</button>
                            <button class="btn-off" onclick="setTouch('${esc(sn)}',false)">Disable</button>
                        </div>
                    </div>
                    <div class="control-row">
                        <span class="control-label">Brightness</span>
                        <div class="slider-row">
                            <input type="range" id="br-${esc(sn)}" min="0" max="100" value="80"
                                oninput="document.getElementById('brv-${esc(sn)}').textContent=this.value" />
                            <span class="slider-val" id="brv-${esc(sn)}">80</span>
                            <button class="btn-set" onclick="setBrightness('${esc(sn)}')">Set</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderNfcSelect() {
            const select = document.getElementById('nfcSelect');
            const currentVal = select.value;
            select.innerHTML = '<option value="">Main screen</option>';
            Object.entries(screenData).forEach(([sn, model]) => {
                const opt = document.createElement('option');
                opt.value = sn;
                opt.textContent = `${model} (${sn})`;
                select.appendChild(opt);
            });
            if ([...select.options].some(o => o.value === currentVal)) {
                select.value = currentVal;
            }
        }

        function setScreen(sn, enabled) {
            exec('sunmi.screen.setScreenSwitch', { sn, enabled });
        }

        function setTouch(sn, enabled) {
            exec('sunmi.screen.setTouchSwitch', { sn, enabled });
        }

        function setBrightness(sn) {
            const val = parseInt(document.getElementById(`br-${sn}`).value);
            exec('sunmi.screen.setBrightness', { sn, brightness: val });
        }

        function setNfcModule() {
            const sn = document.getElementById('nfcSelect').value;
            exec('sunmi.nfc.switchModule', { sn });
        }

        function setNfcWatermark() {
            const alpha = parseInt(document.getElementById('nfcAlpha').value);
            exec('sunmi.nfc.setWatermarkAlpha', { alpha });
        }

        function esc(str) {
            const el = document.createElement('span');
            el.textContent = str;
            return el.innerHTML;
        }
    </script>
</body>
</html>

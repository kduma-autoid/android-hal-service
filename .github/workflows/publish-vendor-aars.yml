name: Publish Vendor AARs

on:
  workflow_dispatch:

jobs:
  publish:
    name: Publish vendor AARs to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish vendor AARs
        id: publish
        run: ./gradlew :vendor:publish --continue
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Report publish result
        if: steps.publish.outcome == 'failure'
        run: echo "::warning::Vendor AAR publish step reported a failure (one or more versions may already exist in GitHub Packages, which is expected for unchanged AARs)."

name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish-npm:
    name: Build and publish NPM packages
    needs: publish-android
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@kduma-autoid'
          cache: 'pnpm'
          cache-dependency-path: 'clients/ts/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: clients/ts

      - name: Build packages
        run: pnpm build
        working-directory: clients/ts

      - name: Publish packages to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/')
        id: publish
        run: pnpm -r --filter './packages/*' publish --no-git-checks --access public
        working-directory: clients/ts
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report publish result
        if: steps.publish.outcome == 'failure'
        run: echo "::warning::Package publish step failed (the version may already exist in GitHub Packages)."

  publish-pages:
    name: Build and publish example to GitHub Pages
    # needs: publish-npm
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'clients/ts/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: clients/ts

      - name: Build packages
        run: pnpm build
        working-directory: clients/ts

      - name: Generate developer key JWT
        run: |
          DEVELOPER_KEY=$(./scripts/make-dev-key.sh \
            --subject hal-web-demo \
            --client-type web \
            --client-id hal-example \
            --origin "https://hal.duma.dev" \
            --permissions "*")
          echo "VITE_DEVELOPER_KEY=${DEVELOPER_KEY}" >> "$GITHUB_ENV"
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

      - name: Build example app
        run: |
          pnpm exec vue-tsc --noEmit
          pnpm exec vite build --base="/"
        working-directory: clients/ts/example

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: clients/ts/example/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  publish-android:
    name: Build and publish Android packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Determine version label
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "label=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "label=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android packages
        run: ./gradlew assembleRelease
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Collect APKs
        run: |
          VERSION="${{ steps.version.outputs.label }}"
          mkdir -p /tmp/android-artifacts
          find . -name '*-release.apk' -not -name '*-unsigned.apk' -path '*/build/outputs/apk/*' | while read -r apk; do
            base=$(basename "$apk" -release.apk)
            # Detect flavor from directory structure: apk/{flavor}/release/ vs apk/release/
            grandparent=$(basename "$(dirname "$(dirname "$apk")")")
            if [[ "$grandparent" != "apk" ]]; then
              module="${base%-"$grandparent"}"
              cp "$apk" "/tmp/android-artifacts/${module}-${VERSION}-${grandparent}.apk"
            else
              cp "$apk" "/tmp/android-artifacts/${base}-${VERSION}.apk"
            fi
          done

      - name: Collect AARs
        run: |
          VERSION="${{ steps.version.outputs.label }}"
          mkdir -p /tmp/aars
          find . -name '*-release.aar' -path '*/build/outputs/aar/*' | while read -r aar; do
            base=$(basename "$aar" -release.aar)
            cp "$aar" "/tmp/android-artifacts/library_${base}-${VERSION}.aar"
          done

      - name: Upload android-artifacts as workflow artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v7
        with:
          name: android-artifacts
          path: /tmp/android-artifacts/*

      - name: Upload android-artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release view "${{ github.ref_name }}" \
            || gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" /tmp/android-artifacts/*.apk --clobber
          gh release upload "${{ github.ref_name }}" /tmp/android-artifacts/*.aar --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Android packages to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/')
        id: publish-android
        run: ./gradlew publish
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Report publish result
        if: steps.publish-android.outcome == 'failure'
        run: echo "::warning::Android package publish step failed (the version may already exist in GitHub Packages)."

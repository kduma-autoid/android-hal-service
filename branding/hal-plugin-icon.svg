<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="hal-plugin-icon-title hal-plugin-icon-desc">
  <title id="hal-plugin-icon-title">HAL Service plugin icon</title>
  <desc id="hal-plugin-icon-desc">The HAL Service icon in negative: a white tile with the chip in the indigo gradient and a jigsaw piece cut out of its body instead of the H — used by plugin bundle apps.</desc>
  <defs>
    <!-- The brand gradient, on the 108 grid of the mark (the same axis as the app tile's gradient). -->
    <linearGradient id="hal-plugin-icon-chip" gradientUnits="userSpaceOnUse" x1="33.8" y1="10.7" x2="74.2" y2="97.3">
      <stop offset="0" stop-color="#7C8CFF"/>
      <stop offset="0.5" stop-color="#4C5CF5"/>
      <stop offset="1" stop-color="#2F33C9"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="102.4" fill="#FFFFFF"/>
  <!-- A hairline edge so the white tile keeps its outline on light backgrounds. -->
  <rect x="1" y="1" width="510" height="510" rx="101.4" fill="none" stroke="#14181D" stroke-opacity="0.1" stroke-width="2"/>
  <g transform="scale(6.736842) translate(-16 -16)" fill="url(#hal-plugin-icon-chip)" aria-hidden="true">
